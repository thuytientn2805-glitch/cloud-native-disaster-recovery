
services:
  database:
    image: postgres:16
    container_name: dr-postgres
    environment:
      POSTGRES_DB: cloud_native_db
      POSTGRES_USER: dr_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing password}
    ports:
      - "5432:5432"
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr_user -d cloud_native_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: ./app
    container_name: dr-app
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: cloud_native_db
      DB_USER: dr_user
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Missing password}
      TEN_UNG_DUNG: "Ung dung Cloud Native"
      MOI_TRUONG: "thu-nghiem"
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: dr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Missing MinIO password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - du_lieu_minio:/data
    restart: unless-stopped

volumes:
  du_lieu_postgres:
  du_lieu_minio:
